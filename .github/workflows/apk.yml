name: Futures Terminal APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # ⚠️ 门禁：跑不过就不构建。
      # 2026-09-28 新增 —— 此前 ui-regression.js 因重复声明整脚本崩溃、从未运行，
      # 而它只写在文档里「要求人记得跑」，没有任何强制力。此步是让门禁名副其实的关键。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regression gate (ui-regression.js)
        run: node scripts/ui-regression.js
      - name: Syntax check (all app JS)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::语法错误"; fail=1; }
          done < <(find app/src/main/assets/js -name '*.js' ! -name '*.bak*' ! -name '*.fixed' ! -path '*/lib/*')
          exit $fail
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 已下架 'tools' 包（默认值含它会导致 Failed to find package 'tools'）
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build release APK
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease

      - name: Sign release APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS_NAME: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/35.0.0"

          # 1) 先发现实际产物名，不猜测（模板硬约束）
          echo "=== release 产物清单 ==="
          find app/build/outputs/apk/release -type f -name '*.apk' -print
          UNSIGNED="$(find app/build/outputs/apk/release -type f -name '*-unsigned.apk' -print -quit)"
          if [ -z "${UNSIGNED}" ]; then
            # 极少数情况 AGP 直接产出已签名包，则退而取任意 apk
            UNSIGNED="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          fi
          test -n "${UNSIGNED}"
          test -f "${UNSIGNED}"
          echo "选定产物: ${UNSIGNED}"
          SIGNED="app/build/outputs/apk/release/futuresterminal-release.apk"

          # 2) 固定正式签名：必须从 Secrets 还原 keystore。
          #    禁止回退临时随机签名——那会让已安装的正式包无法覆盖升级
          #    （见 docs/ANDROID_SIGNING.md 第 3 节第 1、6 条）。
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::未配置 KEYSTORE_BASE64。固定签名需要 Repository Secrets："
            echo "::error::KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEYSTORE_ALIAS / KEY_PASSWORD"
            echo "::error::禁止回退为临时随机签名（见 docs/ANDROID_SIGNING.md）。"
            exit 1
          fi
          echo "使用 Secrets 中的固定签名（可覆盖安装）"
          echo -n "${KEYSTORE_B64}" | base64 -d > release-fixed.jks
          test -s release-fixed.jks
          KS_PASS="${KEYSTORE_PASS}"
          KS_ALIAS="${KEYSTORE_ALIAS_NAME}"
          KS_KEYPASS="${KEY_PASS:-${KEYSTORE_PASSWORD}}"

          # 3) 签名 + 验证（标准顺序，模板硬约束）
          "${BT}/apksigner" sign \
            --ks release-fixed.jks --ks-pass "pass:${KS_PASS}" \
            --ks-key-alias "${KS_ALIAS}" \
            --key-pass "pass:${KS_KEYPASS}" --out "${SIGNED}" "${UNSIGNED}"
          "${BT}/apksigner" verify "${SIGNED}"
          "${BT}/apksigner" verify --print-certs "${SIGNED}" | head -4

          # 3b) 固定签名指纹硬校验：证书 SHA-256 必须等于固定签名资产。
          #     指纹不符 = 用错了 keystore，已安装用户将无法覆盖升级，必须硬失败。
          #     （旧版只打印 --print-certs 供人肉核对，不构成门禁，此处补上。）
          CERT_OUT="$("${BT}/apksigner" verify --print-certs "${SIGNED}")"
          normalize_fp() { printf '%s' "$1" | tr -d ':' | tr -d '[:space:]' | tr 'A-Z' 'a-z'; }
          GOT_FP="$(echo "$CERT_OUT" | grep -m1 -i 'SHA-256 digest' | sed 's/.*digest:[[:space:]]*//')"
          if [ -z "$GOT_FP" ]; then
            # 兜底：某些版本直接打印带冒号的裸指纹行
            GOT_FP="$(echo "$CERT_OUT" | grep -m1 -oE '([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}')"
          fi
          EXPECTED_FP="15:32:B4:21:35:16:65:64:EA:C8:DE:F1:8E:AA:89:8D:F6:E7:17:93:70:82:90:F6:84:6F:D6:C2:77:1F:2B:17"
          GOT_N="$(normalize_fp "$GOT_FP")"
          WANT_N="$(normalize_fp "$EXPECTED_FP")"
          echo "signer_sha256_normalized=$GOT_N"
          if [ -z "$GOT_N" ] || [ "$GOT_N" != "$WANT_N" ]; then
            echo "::error::APK 签名证书指纹与固定签名资产不一致。"
            echo "::error::expected=$WANT_N"
            echo "::error::actual  =$GOT_N"
            echo "::error::请核对 Secrets 中的 KEYSTORE_BASE64 是否为固定签名资产（docs/ANDROID_SIGNING.md）。"
            exit 1
          fi
          echo "fixed signing certificate fingerprint verified"

          # 4) 构建后 APK 级验证
          stat -c '%s bytes %n' "${SIGNED}"
          unzip -tq "${SIGNED}"
          sha256sum "${SIGNED}"

          rm -f release-fixed.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futuresterminal-apk
          path: app/build/outputs/apk/release/futuresterminal-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "${TAG}" \
            app/build/outputs/apk/release/futuresterminal-release.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "期货终端 ${TAG}" \
            --notes "期货终端 v2 Android 版 — 云端构建 APK。数据源：新浪期货 K 线 / 实时行情。"
