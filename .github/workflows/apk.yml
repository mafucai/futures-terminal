name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ----------------------------------------------------------------------
      # Optional release signing.
      #
      # To produce a properly signed release APK, add these repository secrets
      # (Settings -> Secrets and variables -> Actions):
      #
      #   KEYSTORE_BASE64   base64 of your .jks/.keystore file
      #                     (e.g. `base64 -w0 release.keystore`)
      #   KEYSTORE_PASSWORD keystore (store) password
      #   KEY_ALIAS         key alias inside the keystore
      #   KEY_PASSWORD      key password
      #
      # If KEYSTORE_BASE64 is NOT provided, the workflow falls back to the
      # auto-generated Android *debug* keystore, so app/build.gradle still
      # produces an installable (debug-signed) release APK.
      # ----------------------------------------------------------------------
      - name: Decode release keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"

      - name: Configure signing env (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "KEY_ALIAS=${KEY_ALIAS}"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 主子钦定流程：云端编译 + Release 下载
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/futures-terminal-v1.0.0.apk
          ls -la out/

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Futures Terminal build-${{ github.run_number }}
          body: |
            期货终端 v2 — Android WebView 版
            自动构建自 commit ${{ github.sha }}
          files: out/futures-terminal-v1.0.0.apk
          draft: false
          prerelease: false
