name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # ubuntu-latest runner 已预装 Android SDK（ANDROID_HOME 已设）
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME}/platforms" || true
          ls "${ANDROID_HOME}/build-tools" || true
          # 确保 compileSdk 34 的 platform 与 build-tools 存在
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      # ----------------------------------------------------------------------
      # 可选：Release 签名
      # 配置仓库 Secrets（Settings -> Secrets and variables -> Actions）：
      #   KEYSTORE_BASE64    keystore 文件的 base64（base64 -w0 release.keystore）
      #   KEYSTORE_PASSWORD  keystore 密码
      #   KEY_ALIAS          别名
      #   KEY_PASSWORD       别名密码
      # 未配置时回退到 Android 自动生成的 debug 签名，仍可安装。
      # ----------------------------------------------------------------------
      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"

      - name: Configure signing env (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          {
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "KEY_ALIAS=${KEY_ALIAS}"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 主子钦定流程：云端编译 + Release 下载
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/futures-terminal-v1.0.0.apk
          ls -la out/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Futures Terminal build-${{ github.run_number }}
          body: |
            期货终端 v2 — Android WebView 版
            自动构建自 commit ${{ github.sha }}
          files: out/futures-terminal-v1.0.0.apk
          draft: false
          prerelease: false
