plugins { id 'com.android.application' }

android {
    namespace 'com.mafucai.futuresterminal'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mafucai.futuresterminal'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionCode 3
        versionName '2.1.1'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 零第三方依赖：纯 Java/XML + 系统 WebView（模板推荐的轻量组合）
dependencies {
}
