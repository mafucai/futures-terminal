<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期货终端 v2</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ═══ 独立调试面板（body 第一行内联加载，业务 JS 崩溃也能显示）═══ -->
<div id="__dp_panel" style="position:fixed;bottom:8px;right:8px;z-index:99999;background:#111;color:#0f0;font:11px/1.4 monospace;padding:6px 8px;border:1px solid #333;border-radius:4px;display:none;max-width:70vw;white-space:pre-wrap;word-break:break-all;"></div>
<script>
(function () {
  'use strict';
  var panel = document.getElementById('__dp_panel');
  function show(msg) {
    if (!panel) return;
    panel.textContent = msg;
    panel.style.display = 'block';
  }
  window.__dp_trigger = function (msg) { show(String(msg)); };
  // 捕获未处理错误 + 未处理的 Promise 拒绝
  window.addEventListener('error', function (e) {
    show('JS错误: ' + e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    show('Promise拒绝: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  // 双击面板关闭
  if (panel) panel.addEventListener('dblclick', function () { panel.style.display = 'none'; });
})();
</script>
<div class="app">
  <!-- 头部 -->
  <header class="header">
    <div class="header-left">
      <div class="logo">📊</div>
      <div class="title">Futures <span>Terminal</span></div>
      <span class="badge">v2 · 模块化</span>
    </div>
    <div class="status-bar">
      <span class="status-dot"></span>
      <span id="statusText">系统就绪</span>
      <span style="margin-left:12px;color:var(--text-dim)" id="currentTime"></span>
    </div>
  </header>

  <!-- 标签导航 -->
  <div class="tabs">
    <button class="tab active" data-page="pageList">📋 行情</button>
    <button class="tab" data-page="pageStrategy">✏️ 策略</button>
    <button class="tab" data-page="pageBacktest">📊 回测</button>
    <button class="tab" data-page="pageMonitor">📡 监控</button>
  </div>

  <!-- ═══ 页面1：行情列表 ═══ -->
  <div class="page" id="pageList">
    <div class="card">
      <div class="card-header">
        <div class="card-title">📡 实时行情</div>
        <div style="display:flex;gap:6px;align-items:center">
          <span id="favCount" style="font-size:11px;color:var(--text-dim);font-family:var(--font-mono)"></span>
          <button class="btn btn-secondary" id="favFilterBtn" onclick="ListView.toggleFavOnly()">⭐ 收藏</button>
          <button class="btn btn-secondary" onclick="RouteRegistry.dispatch('refresh-data')">⟳ 刷新</button>
        </div>
      </div>
      <div class="input-row">
        <input type="text" id="searchInput" placeholder="🔍 搜索合约名称或代码..." oninput="ListView.renderList()">
        <button class="btn btn-primary" id="loadBtn" onclick="RouteRegistry.dispatch('load-data')">📂 载入数据</button>
        <button class="btn btn-secondary" onclick="RouteRegistry.dispatch('refresh-data')">⟳ 刷新数据</button>
      </div>
      <div id="favBar" class="fav-bar" style="display:none"></div>
      <div id="quoteContainer"><div class="status-bar"><span class="loading"></span><span>加载中...</span></div></div>
    </div>
  </div>

  <!-- ═══ 页面2：K线详情 ═══ -->
  <div class="page page-hidden" id="pageDetail">
    <div class="card">
      <div class="card-header">
        <div class="card-title" id="detailTitle">K线详情</div>
        <div>
          <button class="btn btn-secondary" onclick="RouteRegistry.dispatch('back-to-list')">← 返回列表</button>
          <button class="btn btn-secondary" onclick="DetailView.loadChart(currentCode,currentPeriod,true)" style="margin-left:6px">⟳ 刷新</button>
        </div>
      </div>
      <div id="priceMatrix" class="price-matrix"></div>
      <div style="display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap" id="periodBar"></div>
      <div id="indBar" class="status-bar" style="margin-bottom:8px"></div>
      <div id="chart" style="width:100%;height:400px;background:var(--bg-input);border-radius:var(--radius-sm)"></div>
      <div class="card-title" style="margin:12px 0 4px">成交量</div>
      <div id="volChart" style="width:100%;height:80px;background:var(--bg-input);border-radius:var(--radius-sm)"></div>
      <div class="card-title" style="margin:12px 0 4px">MACD</div>
      <div id="macdChart" style="width:100%;height:100px;background:var(--bg-input);border-radius:var(--radius-sm)"></div>
    </div>
  </div>

  <!-- ═══ 页面3：策略编辑器 ═══ -->
  <div class="page page-hidden" id="pageStrategy">
    <div class="card">
      <div class="card-header">
        <div class="card-title">✏️ 策略编辑器</div>
        <div>
          <button class="btn btn-secondary" onclick="RouteRegistry.dispatch('load-strategy')">读取</button>
          <button class="btn btn-primary" onclick="RouteRegistry.dispatch('save-strategy')" style="margin-left:6px">💾 保存</button>
        </div>
      </div>
      <textarea id="strategyEditor" spellcheck="false" placeholder="// 在此编写你的期货策略..."></textarea>
      <div class="status-bar" id="strategyStatus"><span>策略文件保存在本地，永不联网</span></div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">🔍 策略筛选</div>
        <div>
          <button class="btn btn-secondary" onclick="RouteRegistry.dispatch('prefetch-data')" id="prefetchBtn">📥 预取数据</button>
          <button class="btn btn-primary" onclick="RouteRegistry.dispatch('run-screen')">▶ 运行</button>
        </div>
      </div>
      <div class="status-bar" style="margin-bottom:12px">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="screenMainOnly"> 只看主连
        </label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-left:12px">
          <input type="checkbox" id="screenMulti"> 多周期(4H+1H)
        </label>
      </div>
      <div id="screenResult" style="display:none"></div>
      <div class="status-bar">读本地缓存，不触发网络请求</div>
    </div>
  </div>

  <!-- ═══ 页面4：回测 ═══ -->
  <div class="page page-hidden" id="pageBacktest">
    <div class="card">
      <div class="card-header">
        <div class="card-title">📊 回测引擎</div>
        <button class="btn btn-primary" onclick="RouteRegistry.dispatch('run-backtest')">▶ 运行回测</button>
      </div>
      <div class="input-row">
        <input type="text" id="btCode" placeholder="合约代码，如 agm" style="flex:1">
        <select id="btPeriod" style="background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;color:var(--text-primary);font-family:var(--font-mono);font-size:13px;outline:none">
          <option value="101">日线</option>
          <option value="240">4小时</option>
          <option value="60">60分</option>
          <option value="30">30分</option>
          <option value="15">15分</option>
          <option value="5">5分</option>
        </select>
        <input type="number" id="btLimit" value="200" placeholder="K线数量" style="width:100px">
      </div>
      <div class="status-bar" style="margin-bottom:12px">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="btMulti" checked> 多周期模式（4H定方向 + 1H入场）
        </label>
        <span style="margin-left:12px" id="btModeHint" style="color:var(--text-dim)"></span>
      </div>
      <div id="btResult"></div>
      <div id="btChart" style="width:100%;height:200px;background:var(--bg-input);border-radius:var(--radius-sm);margin-top:12px"></div>
      <div class="status-bar" id="btStatus"></div>
    </div>
  </div>

  <!-- ═══ 页面5：监控 ═══ -->
  <div class="page page-hidden" id="pageMonitor">
    <div class="card">
      <div class="card-header">
        <div class="card-title">📡 实时监控</div>
        <div>
          <button class="btn btn-primary" onclick="RouteRegistry.dispatch('monitor-start')">▶ 启动</button>
          <button class="btn btn-danger" onclick="RouteRegistry.dispatch('monitor-stop')" style="margin-left:6px">⏹ 停止</button>
        </div>
      </div>
      <div class="input-row">
        <input type="text" id="monitorContracts" placeholder="合约代码，逗号分隔（如 agm, fum, aum）" style="flex:1">
      </div>
      <div class="status-bar" id="monitorStatus"><span class="monitor-indicator stopped">● 未启动</span></div>
      <pre id="monitorLog" style="margin-top:12px;min-height:100px;max-height:300px">监控日志将显示在这里</pre>
    </div>
  </div>

  <div class="status-bar" style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);justify-content:center">
    <span>🔒 策略仅本地运行 · 数据源：东方财富 · finance-v2</span>
  </div>
</div>

<script src="js/lib/echarts.min.js"></script>
<script src="js/webdata.js"></script>
<script src="js/indicators.js"></script>
<script src="js/strategy-runner.js"></script>
<script src="js/backtest.js"></script>
<script src="js/screener.js"></script>
<script src="js/monitor.js"></script>
<script src="js/router.js?v=10"></script>
<script src="js/api.js?v=10"></script>
<script src="js/views/list.js?v=10"></script>
<script src="js/views/detail.js?v=10"></script>
<script src="js/views/strategy.js?v=10"></script>
<script src="js/views/backtest.js?v=10"></script>
<script src="js/views/monitor.js?v=10"></script>
<script src="js/app.js?v=10"></script>
</body>
</html>
