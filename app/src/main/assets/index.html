<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<title>期货终端 · Futures Terminal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">📈</div>
      <div>
        <div class="brand-name">Futures <em>Terminal</em></div>
        <div class="brand-sub">本地策略终端 · v2</div>
      </div>
    </div>
    <div class="conn">
      <span class="dot" id="connDot"></span>
      <span id="connText">系统就绪</span>
      <span id="clock" style="color:var(--t3)"></span>
    </div>
  </header>

  <nav class="nav">
    <button class="nav-item on" data-view="vList">📋 行情</button>
    <button class="nav-item" data-view="vStrategy">✏️ 策略</button>
    <button class="nav-item" data-view="vBacktest">📊 回测</button>
    <button class="nav-item" data-view="vMonitor">📡 监控</button>
    <button class="nav-item" data-view="vAI">🤖 AI</button>
  </nav>

  <!-- 行情 -->
  <section class="view" id="vList">
    <div class="panel">
      <div class="panel-hd">
        <div class="panel-title">实时行情</div>
        <div class="panel-acts">
          <span id="favCount" style="font-size:11px;color:var(--t3);font-family:var(--mono)"></span>
          <button class="btn btn-g btn-xs btn-star" id="favToggle" onclick="ListView.toggleStarOnly()">⭐ 收藏</button>
          <button class="btn btn-g btn-xs" onclick="RouteRegistry.dispatch('refresh-data')">⟳ 刷新</button>
        </div>
      </div>
      <div class="row">
        <input type="text" id="searchInput" placeholder="🔍 搜索合约名称或代码…" oninput="ListView.renderList()">
        <button class="btn btn-p" id="loadBtn" onclick="RouteRegistry.dispatch('load-data')">📂 载入行情</button>
      </div>
      <div id="favBar" class="chips" style="display:none"></div>
      <div id="quoteContainer"><div class="note"><span class="spin"></span>正在加载…</div></div>
    </div>
  </section>

  <!-- K线详情 -->
  <section class="view off" id="vDetail">
    <div class="panel">
      <div class="panel-hd">
        <div class="panel-title" id="detailTitle">K线详情</div>
        <div class="panel-acts">
          <button class="btn btn-g btn-xs" onclick="RouteRegistry.dispatch('back-to-list')">← 返回</button>
          <button class="btn btn-g btn-xs" onclick="DetailView.loadChart(currentCode,currentPeriod,true)">⟳ 刷新</button>
        </div>
      </div>
      <div id="priceMatrix" class="matrix"></div>
      <div class="row" id="periodBar" style="gap:4px"></div>
      <div id="indBar" class="note"></div>
      <div id="chart" style="width:100%;height:340px;background:var(--s2);border-radius:var(--r-sm)"></div>
      <div class="panel-title" style="margin:14px 0 6px">成交量</div>
      <div id="volChart" style="width:100%;height:72px;background:var(--s2);border-radius:var(--r-sm)"></div>
      <div class="panel-title" style="margin:14px 0 6px">MACD</div>
      <div id="macdChart" style="width:100%;height:90px;background:var(--s2);border-radius:var(--r-sm)"></div>
    </div>
  </section>

  <!-- 策略 -->
  <section class="view off" id="vStrategy">
    <div class="panel">
      <div class="panel-hd">
        <div class="panel-title">策略编辑器</div>
        <div class="panel-acts">
          <button class="btn btn-g btn-xs" onclick="RouteRegistry.dispatch('load-strategy')">读取</button>
          <button class="btn btn-p btn-xs" onclick="RouteRegistry.dispatch('save-strategy')">💾 保存</button>
        </div>
      </div>
      <textarea id="strategyEditor" spellcheck="false" placeholder="// 在此编写你的期货策略…&#10;// 契约：module.exports.onBar = function(kline, ctx) { return {type,reason} | null }"></textarea>
      <div class="note" id="strategyStatus"><span>🔒 策略保存在本机，永不联网</span></div>
    </div>
    <div class="panel">
      <div class="panel-hd">
        <div class="panel-title">策略筛选（含 5 信号评分）</div>
        <button class="btn btn-p btn-xs" onclick="RouteRegistry.dispatch('run-screen')">▶ 运行</button>
      </div>
      <div class="note" style="margin-bottom:12px">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="screenMainOnly" style="flex:none;width:auto"> 只看主连
        </label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-left:14px">
          <input type="checkbox" id="screenMulti" style="flex:none;width:auto"> 多周期(4H+1H)
        </label>
      </div>
      <div id="screenResult" style="display:none"></div>
      <div class="note">首次运行需在行情页载入数据；评分口径 EMA30+MACD25+RSI20+KDJ15+ATR10</div>
    </div>
  </section>

  <!-- 回测 -->
  <section class="view off" id="vBacktest">
    <div class="panel">
      <div class="panel-hd">
        <div class="panel-title">回测引擎</div>
        <button class="btn btn-p btn-xs" onclick="RouteRegistry.dispatch('run-backtest')">▶ 运行回测</button>
      </div>
      <div class="row">
        <input type="text" id="btCode" placeholder="合约代码，如 agm" style="flex:2">
        <select id="btPeriod">
          <option value="101">日线</option>
          <option value="240">4小时</option>
          <option value="60">60分</option>
          <option value="30">30分</option>
          <option value="15">15分</option>
        </select>
        <input type="number" id="btLimit" value="200" placeholder="K线数" style="flex:0 0 100px">
      </div>
      <div class="note" style="margin-bottom:12px">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="btMulti" style="flex:none;width:auto"> 多周期(4H定方向 + 1H入场)
        </label>
      </div>
      <div id="btResult"></div>
      <div id="btChart" style="width:100%;height:180px;background:var(--s2);border-radius:var(--r-sm);margin-top:12px"></div>
      <div class="note" id="btStatus"></div>
    </div>
  </section>

  <!-- 监控 -->
  <section class="view off" id="vMonitor">
    <div class="panel">
      <div class="panel-hd">
        <div class="panel-title">实时监控</div>
        <div class="panel-acts">
          <button class="btn btn-p btn-xs" onclick="RouteRegistry.dispatch('monitor-start')">▶ 启动</button>
          <button class="btn btn-d btn-xs" onclick="RouteRegistry.dispatch('monitor-stop')">⏹ 停止</button>
        </div>
      </div>
      <div class="row">
        <input type="text" id="monitorContracts" placeholder="合约代码，逗号分隔（如 agm, fum, aum）">
      </div>
      <div class="note" id="monitorStatus"><span class="pill stop">● 未启动</span></div>
      <pre id="monitorLog" style="margin-top:12px;min-height:110px;max-height:300px">监控日志将显示在这里</pre>
    </div>
  </section>

  <!-- AI -->
  <section class="view off" id="vAI">
    <div class="panel">
      <div class="panel-hd">
        <div class="panel-title">AI 接口配置</div>
        <div class="panel-acts">
          <button class="btn btn-g btn-xs" onclick="AIView.testConnection()">🔌 连接测试</button>
          <button class="btn btn-p btn-xs" onclick="AIView.fetchModels()">⟳ 拉取模型</button>
        </div>
      </div>
      <div class="row">
        <input type="text" id="aiBaseUrl" placeholder="API Base URL，如 https://api.openai.com/v1" style="flex:2">
        <input type="password" id="aiKey" placeholder="API Key" style="flex:2">
      </div>
      <div class="row">
        <select id="aiModel" style="flex:2"><option value="">— 先拉取模型列表 —</option></select>
        <input type="number" id="aiTopN" value="3" min="1" max="20" placeholder="Top N" style="flex:0 0 90px">
        <button class="btn btn-g" onclick="AIView.saveConfig()">💾 保存</button>
      </div>
      <div class="note" id="aiConfigStatus"><span>🔒 Key 仅存本机，日志脱敏</span></div>
    </div>
    <div class="panel">
      <div class="panel-hd">
        <div class="panel-title">AI 二轮分析</div>
        <div class="panel-acts">
          <button class="btn btn-p btn-xs" onclick="AIView.runAnalysis()">▶ 运行分析</button>
          <button class="btn btn-g btn-xs" onclick="AIView.loadHistory()">🕘 历史</button>
        </div>
      </div>
      <div class="note" style="margin-bottom:12px"><span id="aiAnalysisStatus">需先完成第一轮策略筛选</span></div>
      <div id="aiResult"><div class="blank"><div class="em">🤖</div><div class="tx">完成配置并运行分析后，结果显示在这里</div></div></div>
    </div>
  </section>

  <footer class="legal">
    <span>🔒 纯本地运行</span>
    <span>数据源：新浪 / 东财</span>
    <span><b>⚠️ 仅供研究，不构成投资建议</b></span>
  </footer>
</div>

<!-- 本地模块（零 CDN，离线可用） -->
<script src="js/lib/echarts.min.js"></script>
<script src="js/indicators.js"></script>
<script src="js/scoring.js"></script>
<script src="js/webdata.js"></script>
<script src="js/strategy-runner.js"></script>
<script src="js/screener.js"></script>
<script src="js/backtest.js"></script>
<script src="js/router.js"></script>
<script src="js/api.js"></script>
<script src="js/views/list.js?v=2"></script>
<script src="js/views/detail.js?v=2"></script>
<script src="js/views/strategy.js?v=2"></script>
<script src="js/views/backtest.js?v=2"></script>
<script src="js/views/monitor.js?v=2"></script>
<script src="js/views/ai.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
